name: Tests

# The unittest suite on all three hosted platforms.
#
# Why a matrix: mcp/runner/reporting.py resolves its fonts from a per-platform
# candidate chain (Times on macOS, Liberation/DejaVu on Linux, times.ttf on
# Windows, then Songti/Noto/arphic/wqy/simsun for CJK). Only the macOS branch has
# ever run on a real host, so a Linux or Windows failure here is a genuine finding
# about the renderer, not CI noise. Nothing in this workflow is continue-on-error
# and nothing installs fonts: a platform that cannot resolve a CJK face must fail
# visibly, with .github/scripts/report_fonts.py in the log explaining which
# candidate chain it walked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The documented test invocation puts the vendored SDK on PYTHONPATH. It is
      # one directory, so the value needs no path separator and behaves the same
      # in bash and pwsh. The step below recreates that directory on a fresh clone.
      PYTHONPATH: .levin-plugin/vendor/python
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      # Keep the retained workspaces inside the worktree so they can be uploaded
      # as evidence when a platform fails, instead of vanishing with the temp dir.
      # prepare_scratch.py also resolves the path: the suite compares the scratch
      # path it is given against paths it derives later, so a symlinked root makes
      # two unrelated path assertions fail. That is an environment fix, not a test
      # change; see the script's docstring.
      - name: Prepare the test scratch directory
        run: python .github/scripts/prepare_scratch.py

      # The runner image declares no CJK font (fonts-noto-color-emoji is the only font
      # package in the Ubuntu 24.04 manifest), so five assertions that expect Chinese
      # (page footer '第 1 页', caption '图') fail there.
      #
      # It must be a TRUETYPE-outline CJK face. `fonts-noto-cjk` installs an
      # OpenType/CFF collection at /usr/share/fonts/opentype/noto/, which ReportLab
      # refuses — the file is present, the face is unusable, and resolution still
      # reports cjk_available: false. wqy-zenhei and arphic uming are TrueType and are
      # already in the candidate chain in reporting.py.
      - name: Install a TrueType CJK font (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei fonts-arphic-uming
          ls -l /usr/share/fonts/truetype/wqy/ /usr/share/fonts/truetype/arphic/ 2>/dev/null || true

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      # .levin-plugin/ is gitignored, so a clone has no levin_plugin_sdk and
      # tests/test_schema_surface.py errors out. The SDK is not on PyPI; the only
      # public copy ships inside the .levin-plugin.tgz attached to a release.
      - name: Provision the Levin plugin SDK from the newest release asset
        run: python .github/scripts/fetch_plugin_sdk.py --root .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report resolved fonts for this platform
        run: python .github/scripts/report_fonts.py

      - name: Run the unittest suite
        run: python -m unittest discover -s tests

      - name: Upload retained test workspaces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-workspaces-${{ matrix.os }}
          path: levin_scratch/ci-tests
          if-no-files-found: ignore
          retention-days: 7
